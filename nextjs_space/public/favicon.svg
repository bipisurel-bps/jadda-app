<svg xmlns="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b6/SVG-Gradient.svg/3840px-SVG-Gradient.svg.png" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B6B4A"/>
      <stop offset="100%" style="stop-color:#145236"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="50%" style="stop-color:#C9A84C"/>
      <stop offset="100%" style="stop-color:#B8972E"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="256" height="256" rx="40" fill="url(#bg)"/>
  <!-- Decorative octagon frame -->
  <path d="M128 28 L183 53 L203 108 L203 148 L183 203 L128 228 L73 203 L53 148 L53 108 L73 53 Z" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.5"/>
  <!-- Inner circle -->
  <circle cx="128" cy="120" r="68" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.3"/>
  <!-- Arabic text جارية -->
  <text x="128" y="138" text-anchor="middle" font-family="'Amiri', 'Traditional Arabic', serif" font-size="72" font-weight="700" fill="url(#gold)" direction="rtl" unicode-bidi="bidi-override">جارية</text>
  <!-- Small decorative dots -->
  <circle cx="128" cy="195" r="2.5" fill="#C9A84C" opacity="0.6"/>
  <circle cx="116" cy="195" r="1.5" fill="#C9A84C" opacity="0.4"/>
  <circle cx="140" cy="195" r="1.5" fill="#C9A84C" opacity="0.4"/>
</svg>
